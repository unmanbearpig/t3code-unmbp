[package]
name = "t3-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "t3_quic"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
host-jni = ["dep:jni"]

[dependencies]
jni = { version = "=0.21.1", optional = true }
futures-util = "=0.3.34"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
url = "=2.5.8"
webpki-roots = "=1.0.7"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "quinn"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["ring", "pem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
