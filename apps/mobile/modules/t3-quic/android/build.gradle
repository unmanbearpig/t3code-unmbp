apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.t3tools.quic'
version = '0.0.0'

def requestedAbis = (project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,x86,arm64-v8a,x86_64').split(',')
def quicAbis = requestedAbis.findAll { it in ['arm64-v8a', 'x86_64'] }.unique()
def nativeOutput = layout.buildDirectory.dir('generated/jniLibs')

android {
  namespace 'expo.modules.t3quic'
  ndkVersion rootProject.ext.ndkVersion
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion rootProject.ext.targetSdkVersion
  }

  sourceSets.main.jniLibs.srcDir(nativeOutput.get().asFile)
}

def buildT3Quic = tasks.register('buildT3Quic', Exec) {
  inputs.files(fileTree('../rust') {
    include 'Cargo.toml', 'Cargo.lock', 'src/**', 'rust-toolchain.toml'
  })
  inputs.file('../scripts/prepare-native.mjs')
  inputs.property('abis', quicAbis.join(','))
  inputs.property('ndkVersion', android.ndkVersion)
  outputs.files(quicAbis.collect { nativeOutput.get().file("${it}/libt3_quic.so") })
  onlyIf { !quicAbis.isEmpty() }

  commandLine 'node', file('../scripts/prepare-native.mjs').absolutePath,
    'android', '--abis', quicAbis.join(','), '--output', nativeOutput.get().asFile.absolutePath,
    '--ndk-version', android.ndkVersion

  doFirst {
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
  }
}

tasks.named('preBuild').configure { dependsOn buildT3Quic }

dependencies {
  implementation project(':expo-modules-core')
}
